<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggcellence - Sign Up</title>
    <link rel="icon" type="image/png" href="egg-icon.png">
    <link rel="stylesheet" type="text/css" href="Login.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&display=swap" rel="stylesheet">
</head>

<body>
    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">
        <div class="signup">
            <form >
                <label for="chk" aria-hidden="true">Sign up</label>
                <input type="text" name="fullName" placeholder="Full name" required="">
                <input type="email" name="email" placeholder="Email" required="">
                <select id="role" required>
                        <option value="" disabled selected>Select your role</option>
                        <option value="Admin">Admin</option>
                        <option value="User">User</option>
                </select>
                <select id="departement" required>
                        <option value="" disabled selected>Select your departement</option>
                        <option value="D1">D1</option>
                        <option value="D2">D2</option>
                        <option value="D3">D3</option>
                        <option value="D4">D4</option>
                </select>
                <input type="Password" id="psw" name="password" placeholder="Select password" required="">
                <input type="Password" id="confirm" name="password" placeholder="Confirm password" required="">
                
                <span id="matchMessage" class="match-message"></span>
                <button type="submit" id="submitBtn">Sign up</button>
            </form>
        </div>
        <div class="login">
            <form>
                <label for="chk" aria-hidden="true">Login</label>
                <input type="email" name="email" placeholder="Email" required="">
                <input type="Password" name="password" placeholder="Select password" required="">
                <a href="ResetPassword.html" class="forgot-pass">Forgot password?</a>
                <button>Login</button>
            </form>
        </div>
    </div>
    <script>
        const password = document.getElementById('psw');
        const confirmPassword = document.getElementById('confirm');
        const matchMessage = document.getElementById('matchMessage');
        const submitBtn = document.getElementById('submitBtn');

        function checkPasswords() {
            const passVal = password.value;
            const confirmVal = confirmPassword.value;

            
            if (confirmVal === "") {
                matchMessage.textContent = "";
                confirmPassword.className = "";
                submitBtn.disabled = false;
                return;
            }

            // Check match condition
            if (passVal === confirmVal) {
                matchMessage.textContent = "✓ Passwords match!";
                matchMessage.className = "match-message success";
                confirmPassword.className = "valid";
                submitBtn.disabled = false;
            } else {
                matchMessage.textContent = "✗ Passwords do not match";
                matchMessage.className = "match-message error";
                confirmPassword.className = "invalid";
                submitBtn.disabled = true; 
            }
        }

        
        password.addEventListener('keyup', checkPasswords);
        confirmPassword.addEventListener('keyup', checkPasswords);
    </script>
</body>
</html>
