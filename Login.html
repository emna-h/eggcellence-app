<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up & Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="Login.css">
    <link rel="icon" type="image/png" href="egg-icon.png">
</head>
<body>

    <div class="main">
        <input type="checkbox" id="chk" aria-hidden="true">

        <div class="signup">
            <form>
                <label for="chk" aria-hidden="true">Sign up</label>
                
                <input type="text" name="fullName" placeholder="Full name" required>
                <input type="email" name="email" placeholder="Email" required>

                <select id="role" name="role" required>
                    <option value="" disabled selected>Select your role</option>
                    <option value="Admin">Admin</option>
                    <option value="User">User</option>
                </select>

                <select id="departement" name="departement" required>
                    <option value="" disabled selected>Select your departement</option>
                    <option value="D1">D1</option>
                    <option value="D2">D2</option>
                    <option value="D3">D3</option>
                    <option value="D4">D4</option>
                </select>

                <div class="password-container">
                    <input 
                        type="password" 
                        id="psw" 
                        name="password" 
                        placeholder="Select password" 
                        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                        title="Password must contain at least 8 characters, including 1 uppercase, 1 lowercase, and 1 number."
                        required
                    >
                    <span class="toggle-eye" onclick="togglePassword('psw', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>

                <div class="password-container">
                    <input 
                        type="password" 
                        id="confirm" 
                        name="confirmPassword" 
                        placeholder="Confirm password" 
                        required
                    >
                    <span class="toggle-eye" onclick="togglePassword('confirm', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>

                <span id="matchMessage" class="match-message"></span>
                <button type="submit" id="submitBtn">Sign up</button>
            </form>
        </div>

        <div class="login">
            <form>
                <label for="chk" aria-hidden="true">Login</label>
                
                <input type="email" name="email" placeholder="Email" required>

                <div class="password-container">
                    <input 
                        type="password" 
                        id="loginPsw" 
                        name="password" 
                        placeholder="Password" 
                        required
                    >
                    <span class="toggle-eye" onclick="togglePassword('loginPsw', this)">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        </svg>
                    </span>
                </div>

                <a href="ResetPassword.html" class="forgot-pass">Forgot password?</a>
                <button type="submit">Login</button>
            </form>
        </div>

    </div>

    <script>

        const openEyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;

        const closedEyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        function togglePassword(inputId, eyeIcon) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';

            input.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword ? openEyeIcon : closedEyeIcon;
        }

        const password = document.getElementById('psw');
        const confirmPassword = document.getElementById('confirm');
        const matchMessage = document.getElementById('matchMessage');
        const submitBtn = document.getElementById('submitBtn');

        const passwordRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;

        function checkPasswords() {
            const passVal = password.value;
            const confirmVal = confirmPassword.value;

            if (passVal === "") {
                matchMessage.textContent = "";
                password.className = "";
                confirmPassword.className = "";
                submitBtn.disabled = false;
                return;
            }

            if (!passwordRegex.test(passVal)) {
                matchMessage.textContent = " Password must be at least 8 chars long with 1 uppercase, 1 lowercase & 1 number.";
                matchMessage.className = "match-message error";
                password.className = "invalid";
                submitBtn.disabled = true;
                return;
            } else {
                password.className = "valid";
            }

            if (confirmVal === "") {
                matchMessage.textContent = " Password strength met!";
                matchMessage.className = "match-message success";
                submitBtn.disabled = true;
                return;
            }

            if (passVal === confirmVal) {
                matchMessage.textContent = "✓ Passwords match & requirement met!";
                matchMessage.className = "match-message success";
                confirmPassword.className = "valid";
                submitBtn.disabled = false;
            } else {
                matchMessage.textContent = "✗ Passwords do not match";
                matchMessage.className = "match-message error";
                confirmPassword.className = "invalid";
                submitBtn.disabled = true; 
            }
        }

        password.addEventListener('input', checkPasswords);
        confirmPassword.addEventListener('input', checkPasswords);

        const API_BASE = 'http://127.0.0.1:5000';

        // ----- SIGN UP -----
        const signupForm = document.querySelector('.signup');
        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                fullName: signupForm.querySelector('[name="fullName"]').value,
                email: signupForm.querySelector('[name="email"]').value,
                role: document.getElementById('role').value,
                departement: document.getElementById('departement').value,
                password: password.value
            };

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating account...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/signup`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    matchMessage.textContent = data.error || 'Signup failed.';
                    matchMessage.className = 'match-message error';
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign up';
                    return;
                }

                // VerifyRole.html reads the session server-side via /api/auth/me,
                // so nothing needs to be stashed in localStorage anymore.
                window.location.href = 'VerifyRole.html';
            } catch (err) {
                matchMessage.textContent = 'Could not reach the server. Is the backend running?';
                matchMessage.className = 'match-message error';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Sign up';
            }
        });

        // ----- LOG IN -----
        const loginForm = document.querySelector('.login');
        const loginBtn = loginForm.querySelector('button[type="submit"]');
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const payload = {
                email: loginForm.querySelector('[name="email"]').value,
                password: document.getElementById('loginPsw').value
            };

            loginBtn.disabled = true;
            loginBtn.textContent = 'Logging in...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if (!res.ok) {
                    alert(data.error || 'Login failed.');
                    loginBtn.disabled = false;
                    loginBtn.textContent = 'Login';
                    return;
                }

                if (!data.is_verified) {
                    window.location.href = 'VerifyRole.html';
                    return;
                }
                window.location.href = data.role === 'Admin' ? 'admin.html' : 'UserDashboard.html';
            } catch (err) {
                alert('Could not reach the server. Is the backend running?');
                loginBtn.disabled = false;
                loginBtn.textContent = 'Login';
            }
        });
    </script>
</body>
</html>
