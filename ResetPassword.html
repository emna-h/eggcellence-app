<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Eggcellence</title>
    <link rel="icon" type="image/png" href="egg-icon.png">
    <link rel="stylesheet" type="text/css" href="ResetPassword.css">
    <link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main">
        <form id="resetForm">
            <label>New Password</label>
            <p class="subtitle">Set a fresh, secure password for your Eggcellence account.</p>
            
            <input type="email" name="email" placeholder="Email" required>

            <div class="password-container">
                <input 
                    type="password" 
                    id="newPassword" 
                    placeholder="New password" 
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                    title="Password must contain at least 8 characters, including 1 uppercase, 1 lowercase, and 1 number."
                    required
                >
                <span class="toggle-eye" onclick="togglePassword('newPassword', this)" title="Toggle password visibility">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </span>
            </div>

            
            <div class="password-container">
                <input 
                    type="password" 
                    id="confirmPassword" 
                    placeholder="Confirm new password" 
                    required
                >
                <span class="toggle-eye" onclick="togglePassword('confirmPassword', this)" title="Toggle password visibility">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                        <line x1="1" y1="1" x2="23" y2="23"></line>
                    </svg>
                </span>
            </div>

            <span id="matchMessage" class="match-message"></span>            
            <button type="submit" id="submitBtn">Reset Password</button>
            <a href="Login.html" class="back-link">← Back to Login</a>
        </form>
    </div>

    
    <script>
        
        const openEyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
        const closedEyeIcon = `<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

        
        function togglePassword(inputId, eyeIcon) {
            const input = document.getElementById(inputId);
            const isPassword = input.type === 'password';

            input.type = isPassword ? 'text' : 'password';
            eyeIcon.innerHTML = isPassword ? openEyeIcon : closedEyeIcon;
        }

        
        const password = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const matchMessage = document.getElementById('matchMessage');
        const submitBtn = document.getElementById('submitBtn');
        const resetForm = document.getElementById('resetForm');
        const mainCard = document.querySelector('.main');

        const passwordRegex = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}$/;

        function checkPasswords() {
            const passVal = password.value;
            const confirmVal = confirmPassword.value;

            if (passVal === "") {
                matchMessage.textContent = "";
                password.className = "";
                confirmPassword.className = "";
                submitBtn.disabled = false;
                return;
            }

            
            if (!passwordRegex.test(passVal)) {
                matchMessage.textContent = " Password must be 8+ chars with 1 uppercase, 1 lowercase & 1 number.";
                matchMessage.className = "match-message error";
                password.className = "invalid";
                submitBtn.disabled = true;
                return;
            } else {
                password.className = "valid";
            }

            if (confirmVal === "") {
                matchMessage.textContent = " Password strength met!";
                matchMessage.className = "match-message success";
                submitBtn.disabled = true;
                return;
            }

            
            if (passVal === confirmVal) {
                matchMessage.textContent = "✓ Passwords match & requirement met!";
                matchMessage.className = "match-message success";
                confirmPassword.className = "valid";
                submitBtn.disabled = false;
            } else {
                matchMessage.textContent = "✗ Passwords do not match";
                matchMessage.className = "match-message error";
                confirmPassword.className = "invalid";
                submitBtn.disabled = true;
            }
        }

        password.addEventListener('input', checkPasswords);
        confirmPassword.addEventListener('input', checkPasswords);

        // 3. Reset Password Form Submission
        const API_BASE = 'http://127.0.0.1:5000';

        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();

            const emailVal = resetForm.querySelector('[name="email"]').value;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            try {
                const res = await fetch(`${API_BASE}/api/auth/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: emailVal, newPassword: password.value })
                });
                const data = await res.json();

                if (!res.ok) {
                    matchMessage.textContent = `✗ ${data.error || 'Reset failed.'}`;
                    matchMessage.className = "match-message error";
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Reset Password';
                    return;
                }

                mainCard.innerHTML = `
                    <div class="success-card">
                        <h2>Eggcellent!</h2>
                        <p>Your password has been reset successfully.</p>
                        <div class="redirect-info">Redirecting to login in <span id="countdown">3</span> seconds...</div>
                        <a href="Login.html" class="login-now-btn">Login Now</a>
                    </div>
                `;

                let secondsLeft = 3;
                const countdownEl = document.getElementById('countdown');
                const timer = setInterval(() => {
                    secondsLeft--;
                    if (countdownEl) countdownEl.textContent = secondsLeft;
                    if (secondsLeft <= 0) {
                        clearInterval(timer);
                        window.location.href = 'Login.html';
                    }
                }, 1000);
            } catch (err) {
                matchMessage.textContent = "✗ Could not reach the server. Is the backend running?";
                matchMessage.className = "match-message error";
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            }
        });
    </script>
</body>
</html>
